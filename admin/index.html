<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Admin | FRP Grating Master</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a1628;
      color: #fff;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #0d2137 0%, #1a3a5c 100%);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #f5a623;
    }
    .header h1 { font-size: 20px; color: #f5a623; }
    .header .user-info { display: flex; align-items: center; gap: 15px; }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s;
    }
    .btn-primary { background: #f5a623; color: #0a1628; }
    .btn-primary:hover { background: #ffb84d; }
    .btn-secondary { background: #2a4a6a; color: #fff; }
    .btn-secondary:hover { background: #3a5a7a; }
    .btn-danger { background: #e74c3c; color: #fff; }
    .container { max-width: 1200px; margin: 0 auto; padding: 40px; }
    
    /* Login Page */
    .login-box {
      max-width: 400px;
      margin: 100px auto;
      background: #0d2137;
      padding: 40px;
      border-radius: 8px;
      border: 1px solid #2a4a6a;
    }
    .login-box h2 { margin-bottom: 20px; color: #f5a623; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #aaa; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #2a4a6a;
      border-radius: 4px;
      background: #0a1628;
      color: #fff;
      font-size: 14px;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      outline: none;
      border-color: #f5a623;
    }
    .form-group textarea { min-height: 200px; resize: vertical; }
    
    /* Post List */
    .post-list { list-style: none; }
    .post-item {
      background: #0d2137;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 6px;
      border-left: 4px solid #f5a623;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .post-item h3 { font-size: 18px; margin-bottom: 5px; }
    .post-item .meta { font-size: 12px; color: #888; }
    .post-actions { display: flex; gap: 10px; }
    
    /* Editor */
    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .editor-header h2 { color: #f5a623; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    
    .alert {
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    .alert-success { background: #27ae60; display: block; }
    .alert-error { background: #e74c3c; display: block; }
    
    .loading { text-align: center; padding: 40px; color: #888; }
    
    .hint { font-size: 12px; color: #666; margin-top: 5px; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const GITHUB_API = 'https://api.github.com';
    const REPO = 'Rick371003/gratingfrp-website';
    const BRANCH = 'main';
    const BLOG_FOLDER = 'blog';

    let token = localStorage.getItem('github_token') || '';

    // 路由
    function router() {
      const hash = window.location.hash.slice(1) || '/';
      const app = document.getElementById('app');
      
      if (!token) {
        renderLogin();
        return;
      }
      
      if (hash === '/' || hash === '/posts') {
        renderPostList();
      } else if (hash.startsWith('/edit/')) {
        const filename = hash.replace('/edit/', '');
        renderEditor(filename);
      } else if (hash === '/new') {
        renderNewPost();
      } else {
        renderPostList();
      }
    }

    // 登录页面
    function renderLogin() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="login-box">
          <h2>Blog Admin Login</h2>
          <div id="alert"></div>
          <div class="form-group">
            <label>GitHub Personal Access Token</label>
            <input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxx">
            <div class="hint">在 GitHub → Settings → Developer settings → Personal access tokens 创建</div>
          </div>
          <button class="btn btn-primary" style="width:100%" onclick="doLogin()">Login</button>
        </div>
      `;
    }

    function doLogin() {
      const input = document.getElementById('token-input').value.trim();
      if (!input) {
        showAlert('Please enter your token', 'error');
        return;
      }
      token = input;
      localStorage.setItem('github_token', token);
      window.location.hash = '/';
      router();
    }

    function logout() {
      localStorage.removeItem('github_token');
      token = '';
      window.location.hash = '/';
      router();
    }

    // 文章列表
    async function renderPostList() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="header">
          <h1>FRP Grating Master - Blog Admin</h1>
          <div class="user-info">
            <button class="btn btn-primary" onclick="window.location.hash='/new'">+ New Post</button>
            <button class="btn btn-secondary" onclick="logout()">Logout</button>
          </div>
        </div>
        <div class="container">
          <div class="loading">Loading posts...</div>
        </div>
      `;

      try {
        const posts = await fetchPosts();
        const container = document.querySelector('.container');
        container.innerHTML = `
          <h2 style="margin-bottom:20px;color:#f5a623">Blog Posts (${posts.length})</h2>
          <div id="alert"></div>
          <ul class="post-list">
            ${posts.map(post => `
              <li class="post-item">
                <div>
                  <h3>${post.title || post.name}</h3>
                  <div class="meta">${post.category || ''} | ${post.date || ''} | ${post.name}</div>
                </div>
                <div class="post-actions">
                  <button class="btn btn-secondary" onclick="window.location.hash='/edit/${post.name}'">Edit</button>
                  <button class="btn btn-danger" onclick="deletePost('${post.name}')">Delete</button>
                </div>
              </li>
            `).join('')}
          </ul>
        `;
      } catch (e) {
        document.querySelector('.container').innerHTML = `
          <div class="alert alert-error">Failed to load posts: ${e.message}</div>
          <button class="btn btn-secondary" onclick="router()">Retry</button>
        `;
      }
    }

    // 获取文章列表
    async function fetchPosts() {
      const response = await fetch(`${GITHUB_API}/repos/${REPO}/contents/${BLOG_FOLDER}?ref=${BRANCH}`, {
        headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
      });
      if (!response.ok) throw new Error(`GitHub API error: ${response.status}`);
      const files = await response.json();
      
      const posts = [];
      for (const file of files) {
        if (file.name.endsWith('.json')) {
          try {
            const content = await fetchFileContent(file.path);
            posts.push({ ...content, name: file.name, path: file.path });
          } catch (e) {
            posts.push({ name: file.name, title: file.name, path: file.path });
          }
        }
      }
      return posts;
    }

    // 获取文件内容
    async function fetchFileContent(path) {
      const response = await fetch(`${GITHUB_API}/repos/${REPO}/contents/${path}?ref=${BRANCH}`, {
        headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
      });
      if (!response.ok) throw new Error(`Failed to fetch ${path}`);
      const data = await response.json();
      // 正确处理UTF-8编码的base64解码
      const content = decodeURIComponent(escape(atob(data.content)));
      return JSON.parse(content);
    }

    // 编辑器
    async function renderEditor(filename) {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="header">
          <h1>Edit Post</h1>
          <button class="btn btn-secondary" onclick="window.location.hash='/'">Back to List</button>
        </div>
        <div class="container">
          <div class="loading">Loading post...</div>
        </div>
      `;

      try {
        const content = await fetchFileContent(`${BLOG_FOLDER}/${filename}`);
        renderEditorForm(content, filename, false);
      } catch (e) {
        document.querySelector('.container').innerHTML = `
          <div class="alert alert-error">Failed to load post: ${e.message}</div>
          <button class="btn btn-secondary" onclick="window.location.hash='/'">Back</button>
        `;
      }
    }

    // 新建文章
    function renderNewPost() {
      const defaultContent = {
        id: '',
        title: '',
        category: 'Technical Guides',
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
        author: 'ZEALL Team',
        excerpt: '',
        img: '',
        content: ''
      };
      renderEditorForm(defaultContent, '', true);
    }

    // 编辑器表单
    function renderEditorForm(content, filename, isNew) {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="header">
          <h1>${isNew ? 'New Post' : 'Edit Post'}</h1>
          <button class="btn btn-secondary" onclick="window.location.hash='/'">Back to List</button>
        </div>
        <div class="container">
          <div id="alert"></div>
          <div class="row">
            <div class="form-group">
              <label>ID (URL slug) *</label>
              <input type="text" id="field-id" value="${content.id || ''}" placeholder="my-new-article">
              <div class="hint">英文小写，用连字符。新建后不可修改</div>
            </div>
            <div class="form-group">
              <label>Title *</label>
              <input type="text" id="field-title" value="${content.title || ''}" placeholder="Article Title">
            </div>
          </div>
          <div class="row">
            <div class="form-group">
              <label>Category</label>
              <select id="field-category">
                <option value="Technical Guides" ${content.category === 'Technical Guides' ? 'selected' : ''}>Technical Guides</option>
                <option value="Market Report" ${content.category === 'Market Report' ? 'selected' : ''}>Market Report</option>
                <option value="Product Knowledge" ${content.category === 'Product Knowledge' ? 'selected' : ''}>Product Knowledge</option>
                <option value="Material Science" ${content.category === 'Material Science' ? 'selected' : ''}>Material Science</option>
                <option value="Case Study" ${content.category === 'Case Study' ? 'selected' : ''}>Case Study</option>
              </select>
            </div>
            <div class="form-group">
              <label>Date</label>
              <input type="text" id="field-date" value="${content.date || ''}" placeholder="Sep 5, 2026">
            </div>
          </div>
          <div class="row">
            <div class="form-group">
              <label>Author</label>
              <input type="text" id="field-author" value="${content.author || ''}" placeholder="ZEALL Team">
            </div>
            <div class="form-group">
              <label>Cover Image URL</label>
              <input type="text" id="field-img" value="${content.img || ''}" placeholder="https://...">
            </div>
          </div>
          <div class="form-group">
            <label>Excerpt (摘要)</label>
            <textarea id="field-excerpt" style="min-height:80px">${content.excerpt || ''}</textarea>
          </div>
          <div class="form-group">
            <label>Content (正文，支持Markdown) *</label>
            <textarea id="field-content" style="min-height:400px">${content.content || ''}</textarea>
          </div>
          <button class="btn btn-primary" style="padding:15px 40px;font-size:16px" onclick="savePost('${filename}', ${isNew})">
            ${isNew ? 'Create Post' : 'Save Changes'}
          </button>
        </div>
      `;
    }

    // 保存文章
    async function savePost(filename, isNew) {
      const id = document.getElementById('field-id').value.trim();
      const title = document.getElementById('field-title').value.trim();
      const category = document.getElementById('field-category').value;
      const date = document.getElementById('field-date').value.trim();
      const author = document.getElementById('field-author').value.trim();
      const img = document.getElementById('field-img').value.trim();
      const excerpt = document.getElementById('field-excerpt').value.trim();
      const content = document.getElementById('field-content').value.trim();

      if (!id || !title || !content) {
        showAlert('Please fill in ID, Title, and Content', 'error');
        return;
      }

      const postData = { id, title, category, date, author, img, excerpt, content };
      const targetFilename = isNew ? `${id}.json` : filename;
      const path = `${BLOG_FOLDER}/${targetFilename}`;

      try {
        let sha = null;
        if (!isNew) {
          // 获取现有文件的sha
          const response = await fetch(`${GITHUB_API}/repos/${REPO}/contents/${path}?ref=${BRANCH}`, {
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
          });
          if (response.ok) {
            const data = await response.json();
            sha = data.sha;
          }
        }

        // 创建或更新文件
        const response = await fetch(`${GITHUB_API}/repos/${REPO}/contents/${path}`, {
          method: 'PUT',
          headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: isNew ? `Create post: ${title}` : `Update post: ${title}`,
            content: btoa(unescape(encodeURIComponent(JSON.stringify(postData, null, 2)))),
            branch: BRANCH,
            sha: sha
          })
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.message || `GitHub API error: ${response.status}`);
        }

        showAlert('Post saved successfully! Website will update in 2-3 minutes.', 'success');
        setTimeout(() => { window.location.hash = '/'; router(); }, 2000);
      } catch (e) {
        showAlert(`Failed to save: ${e.message}`, 'error');
      }
    }

    // 删除文章
    async function deletePost(filename) {
      if (!confirm(`Are you sure you want to delete "${filename}"?`)) return;
      
      try {
        const path = `${BLOG_FOLDER}/${filename}`;
        // 获取文件sha
        const response = await fetch(`${GITHUB_API}/repos/${REPO}/contents/${path}?ref=${BRANCH}`, {
          headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        const data = await response.json();
        
        // 删除文件
        const deleteResponse = await fetch(`${GITHUB_API}/repos/${REPO}/contents/${path}`, {
          method: 'DELETE',
          headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: `Delete post: ${filename}`,
            sha: data.sha,
            branch: BRANCH
          })
        });

        if (!deleteResponse.ok) throw new Error(`Failed to delete: ${deleteResponse.status}`);
        showAlert('Post deleted successfully!', 'success');
        setTimeout(router, 1500);
      } catch (e) {
        showAlert(`Failed to delete: ${e.message}`, 'error');
      }
    }

    // 显示提示
    function showAlert(message, type) {
      const alert = document.getElementById('alert');
      if (!alert) return;
      alert.className = `alert alert-${type}`;
      alert.textContent = message;
      alert.style.display = 'block';
      setTimeout(() => { alert.style.display = 'none'; }, 5000);
    }

    // 初始化
    window.addEventListener('hashchange', router);
    router();
  </script>
</body>
</html>
