<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager | FRP Grating Master</title>
  <script>
    (function() {
      let accessToken = null;
      let tokenType = 'bearer';
      
      const params = new URLSearchParams(window.location.search);
      if (params.get('access_token')) {
        accessToken = params.get('access_token');
        tokenType = params.get('token_type') || 'bearer';
      }
      
      if (!accessToken && window.location.hash) {
        const hash = window.location.hash.replace(/^#\/?/, '');
        const hashParams = new URLSearchParams(hash);
        if (hashParams.get('access_token')) {
          accessToken = hashParams.get('access_token');
          tokenType = hashParams.get('token_type') || 'bearer';
        }
      }
      
      if (accessToken) {
        const user = {
          token: accessToken,
          tokenType: tokenType,
          name: 'Rick371003',
          login: 'Rick371003',
          avatar_url: 'https://github.com/Rick371003.png'
        };
        
        try { localStorage.setItem('decap-cms-user', JSON.stringify(user)); } catch(e) {}
        try { localStorage.setItem('netlify-cms-user', JSON.stringify(user)); } catch(e) {}
        
        window.location.replace(window.location.pathname + '#/');
      }
    })();
  </script>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.0.0/dist/decap-cms.js"></script>
</body>
</html>
