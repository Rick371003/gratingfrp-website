backend:
  name: github
  repo: Rick371003/gratingfrp-website
  branch: main
  auth_type: token

media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: blog
    label: Blog Posts
    folder: blog
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    identifier_field: id
    fields:
      - label: ID
        name: id
        widget: string
      - label: Title
        name: title
        widget: string
      - label: Category
        name: category
        widget: select
        options:
          - Technical Guides
          - Market Report
          - Product Knowledge
          - Material Science
          - Case Study
      - label: Date
        name: date
        widget: string
      - label: Author
        name: author
        widget: string
      - label: Excerpt
        name: excerpt
        widget: text
      - label: Cover Image URL
        name: img
        widget: string
        required: false
      - label: Content
        name: content
        widget: markdown
